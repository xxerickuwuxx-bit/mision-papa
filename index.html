<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACCESO RESTRINGIDO</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(circle at 20% 20%, #24305a, transparent 35%),
    radial-gradient(circle at 80% 80%, #30204d, transparent 35%),
    #05060a;

  color: white;
  font-family: Arial, Helvetica, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    linear-gradient(#ffffff05 1px, transparent 1px),
    linear-gradient(90deg, #ffffff05 1px, transparent 1px);

  background-size: 45px 45px;

  pointer-events: none;
}

.panel {
  width: 90%;
  max-width: 650px;

  padding: 42px;

  border: 1px solid #ffffff18;
  border-radius: 22px;

  background: #ffffff08;

  backdrop-filter: blur(20px);

  box-shadow:
    0 30px 100px #000000aa,
    inset 0 1px #ffffff12;

  animation: aparecer 0.8s ease;
}

@keyframes aparecer {

  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status {
  display: flex;
  align-items: center;
  gap: 10px;

  color: #7cffb2;

  font-size: 12px;
  letter-spacing: 2px;
}

.dot {
  width: 9px;
  height: 9px;

  border-radius: 50%;

  background: #7cffb2;

  box-shadow: 0 0 15px #7cffb2;

  animation: pulsar 1.5s infinite;
}

@keyframes pulsar {

  50% {
    opacity: 0.4;
  }

}

.security {
  padding: 7px 12px;

  border: 1px solid #ffffff18;
  border-radius: 20px;

  color: #aaa;

  font-size: 11px;
}

h1 {
  margin: 40px 0 15px;

  font-size: 44px;
  line-height: 0.95;

  letter-spacing: -2px;
}

h1 span {
  color: #7cffb2;
}

.description {
  color: #999;

  line-height: 1.7;

  font-size: 15px;
}

.line {
  height: 1px;

  background: #ffffff12;

  margin: 30px 0;
}

.lock {
  font-size: 35px;

  margin-bottom: 25px;

  filter: drop-shadow(0 0 15px #7cffb266);
}

label {
  display: block;

  color: #888;

  font-size: 11px;

  letter-spacing: 2px;

  margin-bottom: 10px;
}

input {
  width: 100%;

  padding: 17px;

  border-radius: 10px;

  border: 1px solid #ffffff18;

  background: #00000055;

  color: white;

  outline: none;

  font-size: 16px;

  transition: 0.3s;
}

input:focus {
  border-color: #7cffb2;

  box-shadow: 0 0 20px #7cffb21a;
}

button {
  width: 100%;

  margin-top: 15px;

  padding: 17px;

  border: none;

  border-radius: 10px;

  background: white;

  color: black;

  font-weight: bold;

  cursor: pointer;

  transition: 0.25s;
}

button span {
  float: right;
}

button:hover {
  transform: translateY(-2px);

  box-shadow: 0 10px 30px #ffffff20;
}

#resultado {
  margin-top: 20px;

  line-height: 1.6;
}

.success {
  color: #7cffb2;
}

.error {
  color: #ff7373;
}

.footer {
  margin-top: 30px;

  color: #555;

  font-size: 10px;

  letter-spacing: 2px;

  text-align: center;
}

</style>
</head>

<body>

<div class="panel">

  <div class="header">

    <div class="status">
      <span class="dot"></span>
      SISTEMA ONLINE
    </div>

    <div class="security">
      NIVEL 01
    </div>

  </div>

  <h1>
    ACCESO<br>
    <span>RESTRINGIDO</span>
  </h1>

  <p class="description">
    Se ha detectado una solicitud pendiente.
    <br>
    Para continuar, demuestra que tienes autorización.
  </p>

  <div class="line"></div>

  <div class="lock">
    🔐
  </div>

  <label>
    CONTRASEÑA DEL ARCHIVO
  </label>

  <input
    id="clave"
    type="text"
    placeholder="Introduce la palabra..."
    autocomplete="off"
  >

  <button onclick="verificar()">
    DESBLOQUEAR ARCHIVO
    <span>→</span>
  </button>

  <div id="resultado"></div>

  <div class="footer">
    SECURE SYSTEM // ARCHIVO 001
  </div>

</div>

<script>

function verificar() {

  const clave = document
    .getElementById("clave")
    .value
    .trim()
    .toUpperCase();

  const resultado =
    document.getElementById("resultado");

  if (clave === "ACCESO") {

    resultado.innerHTML = `
      <div class="success">
        ✓ IDENTIDAD CONFIRMADA<br>
        ✓ ARCHIVO DESBLOQUEADO<br><br>
        Preparando siguiente prueba...
      </div>
    `;

  } else {

    resultado.innerHTML = `
      <div class="error">
        ✕ CONTRASEÑA INCORRECTA<br>
        El acceso continúa bloqueado.
      </div>
    `;

  }

}

</script>

</body>
</html>
