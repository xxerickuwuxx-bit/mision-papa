<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARCHIVO 002</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, #24305a, transparent 35%),
    radial-gradient(circle at 80% 80%, #30204d, transparent 35%),
    #05060a;

  color: white;
  font-family: Arial, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;
}

.panel {
  width: 90%;
  max-width: 700px;
  padding: 45px;

  border: 1px solid #ffffff18;
  border-radius: 22px;

  background: #ffffff08;
  backdrop-filter: blur(20px);

  box-shadow: 0 30px 100px #000000aa;
}

.status {
  color: #7cffb2;
  font-size: 12px;
  letter-spacing: 2px;
}

h1 {
  font-size: 38px;
  margin: 30px 0 10px;
}

.subtitle {
  color: #888;
}

.question {
  margin-top: 35px;
  padding: 25px;

  background: #00000055;
  border-radius: 12px;

  line-height: 1.8;
}

input {
  width: 100%;
  margin-top: 20px;
  padding: 16px;

  border-radius: 10px;
  border: 1px solid #ffffff18;

  background: #00000066;
  color: white;

  outline: none;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 16px;

  border: none;
  border-radius: 10px;

  background: white;
  color: black;

  font-weight: bold;
  cursor: pointer;
}

#resultado {
  margin-top: 20px;
  line-height: 1.6;
}

.error {
  color: #ff7373;
}

.success {
  color: #7cffb2;
}
</style>
</head>

<body>

<div class="panel">

  <div class="status">
    ● SISTEMA ONLINE // ARCHIVO 002
  </div>

  <h1>Segunda prueba</h1>

  <p class="subtitle">
    El primer acceso ha sido confirmado.
    Ahora necesitas descubrir la siguiente clave.
  </p>

  <div class="question">

    🧩 <strong>ACERTIJO</strong>

    <br><br>

    Tengo teclas, pero no soy un piano.
    <br>
    Tengo espacio, pero no soy una habitación.
    <br>
    Puedes entrar, pero no puedes caminar dentro de mí.

    <br><br>

    ¿Qué soy?

  </div>

  <input
    id="respuesta"
    type="text"
    placeholder="Escribe tu respuesta..."
    autocomplete="off"
  >

  <button onclick="comprobar()">
    COMPROBAR RESPUESTA →
  </button>

  <div id="resultado"></div>

</div>

<script>

function comprobar() {

  const respuesta = document
    .getElementById("respuesta")
    .value
    .trim()
    .toLowerCase();

  const resultado =
    document.getElementById("resultado");

  if (
    respuesta === "teclado" ||
    respuesta === "un teclado"
  ) {

    resultado.innerHTML = `
      <div class="success">
        ✓ RESPUESTA CORRECTA<br><br>
        Has encontrado la siguiente clave.
      </div>
    `;

  } else {

    resultado.innerHTML = `
      <div class="error">
        ✕ RESPUESTA INCORRECTA<br>
        La prueba continúa bloqueada.
      </div>
    `;
  }
}

</script>

</body>
</html>
